<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Shardai AWS Project</title>

    <!-- Modern Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0A2F24, #0F4C3A, #1B5E20);
            color: #E8F5E9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .card {
            background: rgba(15, 76, 58, 0.85);
            padding: 50px;
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
            text-align: center;
            width: 90%;
            max-width: 600px;
            backdrop-filter: blur(10px);
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #A5D6A7;
            letter-spacing: 1px;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
            color: #C8E6C9;
            margin-bottom: 25px;
        }

        .badge {
            display: inline-block;
            padding: 10px 20px;
            background: #1B5E20;
            border-radius: 10px;
            font-size: 15px;
            color: #C8E6C9;
            letter-spacing: 0.7px;
            font-weight: 600;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }

        /* Subtle floating animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Welcome to My AWS S3 Site</h1>
        <p>This  webpage is hosted entirely on Amazon S3.</p>
        <div class="badge">Hosted on AWS S3</div>
    </div>
</body>
</html>
